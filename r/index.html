<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>tektik.la — yönlendiriliyor</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: monospace; background: #0a0a0a; color: #f0f0f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 16px; }
  .logo { font-size: 20px; font-weight: 700; color: #888; }
  .logo span { color: #c8f530; }
  .msg { font-size: 13px; color: #555; }
  .spinner { width: 24px; height: 24px; border: 2px solid #222; border-top-color: #c8f530; border-radius: 50%; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error-msg { color: #ff6060; font-size: 13px; display: none; }
  .home-link { color: #c8f530; text-decoration: none; font-size: 12px; margin-top: 8px; }
  #debug { font-size: 11px; color: #444; margin-top: 8px; }
</style>
</head>
<body>
<div class="logo">tektik<span>.la</span></div>
<div class="spinner" id="spinner"></div>
<div class="msg" id="msg">Yönlendiriliyor...</div>
<div class="error-msg" id="error">Bu link bulunamadı veya süresi dolmuş.</div>
<div id="debug"></div>
<a href="/" class="home-link" id="home-link" style="display:none">← Ana sayfaya dön</a>

<script>
var SUPABASE_URL = 'https://yxeuthrfqdquqgzwuxvm.supabase.co';
var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl4ZXV0aHJmcWRxdXFnend1eHZtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIxODE4NzcsImV4cCI6MjA4Nzc1Nzg3N30.h3hNyF_VOuCgnahMfzdGPXzohqDe4pOVVcjHhYyq06s';

function showError(msg) {
  document.getElementById('spinner').style.display = 'none';
  document.getElementById('msg').style.display = 'none';
  document.getElementById('error').style.display = 'block';
  document.getElementById('error').textContent = msg || 'Bu link bulunamadı veya süresi dolmuş.';
  document.getElementById('home-link').style.display = 'inline';
}

// URL'den slug al - birden fazla yöntem dene
var slug = '';
var path = window.location.pathname; // /r/8vy46a
var hash = window.location.hash;     // #8vy46a (fallback)
var search = window.location.search; // ?s=8vy46a (fallback)

document.getElementById('debug').textContent = 'path: ' + path;

// Yöntem 1: pathname'den
var match = path.match(/\/r\/([^\/]+)/);
if (match) slug = match[1];

// Yöntem 2: hash'ten (fallback)
if (!slug && hash) slug = hash.replace('#', '');

// Yöntem 3: query string'den
if (!slug && search) {
  var params = new URLSearchParams(search);
  slug = params.get('s') || params.get('slug') || '';
}

document.getElementById('debug').textContent = 'path: ' + path + ' | slug: ' + slug;

if (!slug) {
  showError('Link bulunamadı.');
} else {
  fetch(SUPABASE_URL + '/rest/v1/links?slug=eq.' + slug + '&select=original_url,expires_at,click_count', {
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + SUPABASE_KEY
    }
  })
  .then(function(res) { return res.json(); })
  .then(function(data) {
    if (!data || data.length === 0) { showError('Bu link bulunamadı.'); return; }
    var original_url = data[0].original_url;
    var expires_at = data[0].expires_at;
    if (expires_at && new Date(expires_at) < new Date()) { showError('Bu linkin süresi dolmuş.'); return; }

    // Click artır
    fetch(SUPABASE_URL + '/rest/v1/links?slug=eq.' + slug, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY },
      body: JSON.stringify({ click_count: (data[0].click_count || 0) + 1 })
    });

    window.location.replace(original_url);
  })
  .catch(function(e) {
    showError('Hata: ' + e.message);
  });
}
</script>
</body>
</html>

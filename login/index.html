<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giriş Yap — tektik.la</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  
  .auth-box {
    background: white;
    padding: 40px;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    width: 100%;
    max-width: 440px;
  }
  
  .logo {
    text-align: center;
    font-size: 28px;
    font-weight: bold;
    color: #667eea;
    margin-bottom: 8px;
    text-decoration: none;
    display: block;
  }
  
  h1 {
    text-align: center;
    color: #333;
    margin-bottom: 8px;
    font-size: 24px;
  }
  
  .subtitle {
    text-align: center;
    color: #666;
    margin-bottom: 30px;
  }
  
  .form-group {
    margin-bottom: 20px;
  }
  
  label {
    display: block;
    font-weight: 600;
    color: #333;
    margin-bottom: 8px;
    font-size: 14px;
  }
  
  input {
    width: 100%;
    padding: 12px 14px;
    border: 2px solid #e5e5e5;
    border-radius: 8px;
    font-size: 15px;
    transition: border 0.2s;
  }
  
  input:focus {
    outline: none;
    border-color: #667eea;
  }
  
  button {
    width: 100%;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border: none;
    padding: 14px;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  
  button:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
  }
  
  button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }
  
  .alert {
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 20px;
    display: none;
    font-size: 14px;
  }
  
  .alert-error {
    background: #fee;
    color: #c33;
    border: 1px solid #fcc;
  }
  
  .alert-success {
    background: #efe;
    color: #2a8;
    border: 1px solid #cfc;
  }
  
  .footer-text {
    text-align: center;
    margin-top: 20px;
    color: #666;
    font-size: 14px;
  }
  
  .footer-text a {
    color: #667eea;
    text-decoration: none;
    font-weight: 600;
  }
  
  .footer-text a:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>

<div class="auth-box">
  <a href="/" class="logo">⚡ tektik.la</a>
  <h1>Hoş Geldin</h1>
  <p class="subtitle">Hesabına giriş yap</p>
  
  <div id="alert" class="alert"></div>
  
  <form id="loginForm">
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="ornek@email.com" required>
    </div>
    
    <div class="form-group">
      <label for="password">Şifre</label>
      <input type="password" id="password" placeholder="Şifren" required>
    </div>
    
    <button type="submit" id="submitBtn">Giriş Yap</button>
  </form>
  
  <p class="footer-text">
    Hesabın yok mu? <a href="/signup">Kayıt ol</a>
  </p>
</div>

<script src="/config.js"></script>
<script>
  if (Auth.isLoggedIn()) {
    window.location.href = '/dashboard';
  }
  
  const form = document.getElementById('loginForm');
  const alert = document.getElementById('alert');
  const submitBtn = document.getElementById('submitBtn');
  
  function showAlert(message, type = 'error') {
    alert.textContent = message;
    alert.className = `alert alert-${type}`;
    alert.style.display = 'block';
  }
  
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    
    submitBtn.disabled = true;
    submitBtn.textContent = '⏳ Giriş yapılıyor...';
    alert.style.display = 'none';
    
    try {
      const data = await apiCall('/api/auth/login', {
        method: 'POST',
        body: JSON.stringify({ email, password })
      });
      
      Auth.setToken(data.token);
      Auth.setUser(data.user);
      
      showAlert('✅ Giriş başarılı! Yönlendiriliyorsun...', 'success');
      
      setTimeout(() => {
        window.location.href = '/dashboard';
      }, 800);
      
    } catch (error) {
      showAlert(error.message);
      submitBtn.disabled = false;
      submitBtn.textContent = 'Giriş Yap';
    }
  });
</script>

</body>
</html>

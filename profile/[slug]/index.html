<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yükleniyor... — tektik.la</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root[data-theme="dark"] {
    --bg: #0a0a0a;
    --bg2: #141414;
    --bg3: #1a1a1a;
    --border: #2a2a2a;
    --text: #f0f0f0;
    --text2: #888;
    --text3: #555;
    --accent: #c8f530;
    --card: #141414;
  }

  :root[data-theme="light"] {
    --bg: #f5f5f0;
    --bg2: #ebeae3;
    --bg3: #e5e4de;
    --border: #d0cfc8;
    --text: #111;
    --text2: #666;
    --text3: #999;
    --accent: #1a6b00;
    --card: #fff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Bricolage Grotesque', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .grid-bg {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.03;
    background-image: linear-gradient(var(--text) 1px, transparent 1px), linear-gradient(90deg, var(--text) 1px, transparent 1px);
    background-size: 40px 40px;
    z-index: 0;
  }

  .content {
    position: relative;
    z-index: 1;
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 40px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
  }

  .logo {
    font-family: 'Space Mono', monospace;
    font-size: 18px;
    font-weight: 700;
    text-decoration: none;
    color: var(--text);
  }

  .logo span { color: var(--accent); }

  .path-indicator {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--text2);
    padding: 6px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    letter-spacing: 1px;
  }

  .header-actions {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .ctrl-btn {
    background: var(--bg2);
    border: 1px solid var(--border);
    color: var(--text2);
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    transition: all 0.2s;
    text-decoration: none;
  }

  .ctrl-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  /* ============================================
     PROFILE PAGE — Telefon çerçevesi (desktop)
     Mobile'de tam ekran (kullanıcı zaten telefonda)
     ============================================ */
  .profile-main {
    flex: 1;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 40px 20px;
  }

  .phone-frame {
    width: 100%;
    max-width: 480px;
  }

  .phone-screen-content {
    background: transparent;
  }

  .phone-statusbar {
    display: none;
  }

  /* DESKTOP: Telefon çerçevesi göster */
  @media (min-width: 768px) {
    .profile-main {
      padding: 60px 20px 80px;
    }
    .phone-frame {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 40px;
      padding: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      max-width: 380px;
    }
    .phone-screen-content {
      background: var(--bg);
      border-radius: 30px;
      overflow: hidden;
      min-height: 720px;
    }
    .phone-statusbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 24px 8px;
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      color: var(--text2);
    }
    .phone-statusbar .url {
      color: var(--accent);
      font-weight: 700;
    }
  }

  /* PROFIL İÇERİĞİ */
  .profile-card {
    padding: 24px 24px 32px;
  }

  .profile-header {
    text-align: center;
    margin-bottom: 24px;
  }

  .profile-label {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--accent);
    letter-spacing: 2px;
    margin-bottom: 16px;
    display: block;
  }

  .profile-label::before { content: "— "; }

  .avatar {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    background: var(--bg2);
    border: 3px solid var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Space Mono', monospace;
    font-size: 36px;
    font-weight: 700;
    color: var(--accent);
    margin: 0 auto 16px;
    overflow: hidden;
    flex-shrink: 0;
  }

  .avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .profile-name {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -1px;
    line-height: 1;
    margin-bottom: 8px;
    color: var(--text);
    word-break: break-word;
  }

  .profile-slug {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    color: var(--text2);
    margin-bottom: 16px;
    letter-spacing: 0.5px;
  }

  .profile-slug span { color: var(--accent); }

  .profile-bio {
    font-size: 14px;
    color: var(--text);
    line-height: 1.6;
    white-space: pre-wrap;
    opacity: 0.85;
    margin-bottom: 20px;
    text-align: left;
    padding: 0 4px;
  }

  /* Socials */
  .socials {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
    gap: 8px;
    margin-bottom: 24px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--border);
  }

  .social-btn {
    border: 1px solid var(--border);
    background: var(--bg2);
    border-radius: 10px;
    padding: 10px 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    color: var(--text2);
    text-decoration: none;
    font-family: 'Space Mono', monospace;
    transition: all 0.2s;
    min-height: 56px;
  }

  .social-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    transform: translateY(-2px);
  }

  .social-btn .social-icon {
    font-size: 16px;
    font-weight: 700;
    line-height: 1;
  }

  .social-btn .social-name {
    font-size: 9px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    line-height: 1;
  }

  /* Links */
  .links {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .link-btn {
    background: var(--bg2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 14px 18px;
    border-radius: 10px;
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 600;
    font-size: 14px;
    text-decoration: none;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: all 0.2s;
  }

  .link-btn:hover {
    border-color: var(--accent);
    transform: translateY(-1px);
  }

  .link-btn .arrow {
    font-family: 'Space Mono', monospace;
    color: var(--text2);
    font-size: 13px;
    transition: color 0.2s;
  }

  .link-btn:hover .arrow {
    color: var(--accent);
  }

  /* First link is highlighted */
  .link-btn.featured {
    background: var(--accent);
    color: #0a0a0a;
    border-color: var(--accent);
    font-weight: 700;
  }

  .link-btn.featured .arrow {
    color: #0a0a0a;
  }

  .link-btn.featured:hover {
    transform: translateY(-2px);
    opacity: 0.95;
  }

  .empty {
    text-align: center;
    padding: 40px 20px;
    color: var(--text2);
    font-family: 'Space Mono', monospace;
    font-size: 13px;
  }

  .loading {
    text-align: center;
    padding: 60px 20px;
    color: var(--text2);
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    letter-spacing: 1px;
  }

  /* Footer CTA */
  .profile-footer {
    margin-top: 28px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    text-align: center;
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--text2);
    letter-spacing: 0.5px;
    line-height: 1.6;
  }

  .profile-footer a {
    color: var(--accent);
    text-decoration: none;
    font-weight: 700;
    white-space: nowrap;
  }

  .profile-footer a:hover {
    text-decoration: underline;
  }

  /* Site footer */
  .site-footer {
    border-top: 1px solid var(--border);
    padding: 20px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .site-footer p {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--text2);
  }

  /* Error page */
  .error-block {
    text-align: center;
    padding: 60px 20px;
  }

  .error-code {
    font-family: 'Space Mono', monospace;
    font-size: 80px;
    font-weight: 700;
    color: var(--accent);
    line-height: 1;
    letter-spacing: -3px;
    margin-bottom: 16px;
  }

  .error-title {
    font-size: 22px;
    font-weight: 800;
    margin-bottom: 12px;
  }

  .error-msg {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    color: var(--text2);
    margin-bottom: 28px;
    line-height: 1.6;
  }

  .error-msg span { color: var(--accent); }

  .error-cta {
    display: inline-block;
    background: var(--accent);
    color: #0a0a0a;
    padding: 12px 24px;
    border-radius: 8px;
    text-decoration: none;
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    transition: all 0.2s;
  }

  .error-cta:hover {
    transform: translateY(-1px);
    opacity: 0.9;
  }

  @media (max-width: 600px) {
    header { padding: 16px 20px; }
    .profile-main { padding: 24px 16px; }
    .site-footer { padding: 16px 20px; flex-direction: column; gap: 8px; }
    .avatar { width: 80px; height: 80px; font-size: 28px; }
    .profile-name { font-size: 24px; }
    .profile-card { padding: 16px 16px 24px; }
  }
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="content">
  <header>
    <a href="/" class="logo">tektik<span>.la</span></a>
    <div class="header-actions">
      <span class="path-indicator" id="pathIndicator">/ ...</span>
      <button class="ctrl-btn" onclick="toggleTheme()">◐</button>
    </div>
  </header>

  <main class="profile-main">
    <div class="phone-frame">
      <div class="phone-screen-content">
        <div class="phone-statusbar">
          <span id="statusbar-time">09:41</span>
          <span class="url" id="statusbar-url">tektik.la/...</span>
          <span>📶</span>
        </div>
        <div class="profile-card" id="content">
          <div class="loading">⏳ YÜKLENİYOR...</div>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <p>© 2026 tektik.la</p>
    <p style="font-family:'Space Mono',monospace;font-size:11px;color:var(--text2);">v1.0</p>
  </footer>
</div>

<script src="/config.js"></script>
<script>
  function toggleTheme() {
    const html = document.documentElement;
    const current = html.getAttribute('data-theme');
    const next = current === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', next);
    localStorage.setItem('tektik_theme', next);
  }
  const savedTheme = localStorage.getItem('tektik_theme');
  if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);

  function getSlug() {
    const urlParams = new URLSearchParams(window.location.search);
    const querySlug = urlParams.get('slug');
    if (querySlug) return querySlug;

    const path = window.location.pathname;
    const profileMatch = path.match(/^\/profile\/([^\/]+)\/?$/);
    if (profileMatch) return profileMatch[1];

    const shortMatch = path.match(/^\/([^\/]+)\/?$/);
    if (shortMatch && shortMatch[1] !== 'profile.html' && shortMatch[1] !== 'profile') {
      return shortMatch[1];
    }

    return null;
  }

  const slug = getSlug();
  const content = document.getElementById('content');
  const pathIndicator = document.getElementById('pathIndicator');
  const statusbarUrl = document.getElementById('statusbar-url');
  const statusbarTime = document.getElementById('statusbar-time');
  
  if (slug) {
    pathIndicator.textContent = `/ ${slug.toUpperCase()}`;
    if (statusbarUrl) statusbarUrl.textContent = `tektik.la/${slug}`;
  }

  // Status bar saat - ziyaretçinin gerçek saati
  function updateStatusbarTime() {
    if (!statusbarTime) return;
    const now = new Date();
    const hh = String(now.getHours()).padStart(2, '0');
    const mm = String(now.getMinutes()).padStart(2, '0');
    statusbarTime.textContent = `${hh}:${mm}`;
  }
  updateStatusbarTime();
  // Her dakika güncelle
  setInterval(updateStatusbarTime, 30000);

  const socialPlatforms = {
    twitter:   { icon: '𝕏',    name: 'Twitter / X' },
    instagram: { icon: 'IG',   name: 'Instagram' },
    threads:   { icon: '@',    name: 'Threads' },
    linkedin:  { icon: 'in',   name: 'LinkedIn' },
    youtube:   { icon: '▶',    name: 'YouTube' },
    tiktok:    { icon: '♪',    name: 'TikTok' },
    twitch:    { icon: 'tw',   name: 'Twitch' },
    kick:      { icon: '⚡',    name: 'Kick' },
    github:    { icon: '</>',  name: 'GitHub' }
  };

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text || '';
    return div.innerHTML;
  }

  async function loadProfile() {
    if (!slug) {
      showError('Hangi profili görmek istediğini anlayamadım.', '?');
      return;
    }

    try {
      const data = await apiCall(`/api/profile/${slug}`);
      const { profile, links, socials } = data;

      document.title = `${profile.title || profile.slug} — tektik.la`;

      const avatarHtml = profile.avatar_url
        ? `<div class="avatar"><img src="${escapeHtml(profile.avatar_url)}" alt=""></div>`
        : `<div class="avatar">${profile.slug.charAt(0).toUpperCase()}</div>`;

      const socialsHtml = socials && socials.length > 0
        ? `<div class="socials">${socials.map(s => {
            const platform = socialPlatforms[s.platform] || { icon: '↗', name: s.platform };
            return `<a href="${escapeHtml(s.url)}" target="_blank" rel="noopener" class="social-btn" aria-label="${escapeHtml(platform.name)}">
              <span class="social-icon">${platform.icon}</span>
              <span class="social-name">${escapeHtml(platform.name)}</span>
            </a>`;
          }).join('')}</div>`
        : '';

      const linksHtml = links && links.length > 0
        ? `<div class="links">${links.map((l, i) =>
            `<a href="${escapeHtml(l.url)}" target="_blank" rel="noopener" class="link-btn${i === 0 ? ' featured' : ''}">
              <span>${escapeHtml(l.title)}</span>
              <span class="arrow">→</span>
            </a>`
          ).join('')}</div>`
        : '<div class="empty">Henüz link eklenmemiş.</div>';

      content.innerHTML = `
        <div class="profile-header">
          <span class="profile-label">PROFİL</span>
          ${avatarHtml}
          <h1 class="profile-name">${escapeHtml(profile.title || profile.slug)}</h1>
          <div class="profile-slug">tektik.la<span>/${escapeHtml(profile.slug)}</span></div>
          ${profile.bio ? `<p class="profile-bio">${escapeHtml(profile.bio)}</p>` : ''}
        </div>
        ${socialsHtml}
        ${linksHtml}
        <div class="profile-footer">
          <a href="/signup">Sen de profil oluştur →</a>
        </div>
      `;

    } catch (error) {
      showError(`<span>tektik.la/${escapeHtml(slug)}</span> diye bir profil yok.`, '?');
      document.title = 'Bulunamadı — tektik.la';
    }
  }

  function showError(msg, code) {
    content.innerHTML = `
      <div class="error-block">
        <div class="error-code">${code}</div>
        <div class="error-title">Profil bulunamadı.</div>
        <p class="error-msg">${msg}<br>Belki yazım hatası, belki henüz alınmamış.</p>
        <a href="/signup" class="error-cta">BU ADI SEN KAP →</a>
      </div>
    `;
  }

  loadProfile();
</script>

</body>
</html>

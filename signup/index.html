<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kayıt Ol — tektik.la</title>
<meta name="description" content="tektik.la'da hesabını oluştur. 30 gün ücretsiz, kredi kartı gerekmez.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/auth.css">
</head>
<body>
<div class="grid-bg"></div>
<div class="content">
  <header>
    <a href="/" class="logo">tektik<span>.la</span></a>
    <div class="header-actions">
      <span class="path-indicator">/ SIGNUP</span>
      <button class="ctrl-btn" onclick="toggleTheme()">◐</button>
    </div>
  </header>

  <main class="auth-main">
    <div class="auth-box">
      <span class="trial-badge">🎁 30 GÜN ÜCRETSİZ</span>
      
      <span class="auth-label">— HESAP OLUŞTUR</span>
      <h1 class="auth-title">hesabını <span>oluştur</span></h1>
      <p class="auth-subtitle">Birkaç saniyede başla. Kredi kartı gerekmez. İstediğin zaman iptal et.</p>

      <div id="alert" class="alert"></div>

      <form id="signupForm">
        <div class="form-group">
          <label class="form-label" for="slug">Kullanıcı Adın</label>
          <div class="input-with-prefix">
            <span class="input-prefix">tektik.la/</span>
            <input 
              type="text" 
              id="slug" 
              placeholder="ahmet"
              required
              minlength="2"
              maxlength="30"
              autocomplete="username"
            >
          </div>
          <div class="form-hint">Sadece küçük harf, rakam ve tire kullan</div>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input 
            type="email" 
            id="email" 
            class="form-input"
            placeholder="ornek@email.com"
            required
            autocomplete="email"
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Şifre</label>
          <input 
            type="password" 
            id="password" 
            class="form-input"
            placeholder="En az 6 karakter"
            required
            minlength="6"
            autocomplete="new-password"
          >
        </div>

        <button type="submit" id="submitBtn" class="btn-primary">BAŞLA →</button>
      </form>

      <div class="auth-footer">
        Hesabın var mı? <a href="/login">Giriş yap</a>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <p>© 2026 tektik.la</p>
    <p style="font-family:'Space Mono',monospace;font-size:11px;color:var(--text2);">v1.0</p>
  </footer>
</div>

<script src="/config.js"></script>
<script>
  // Theme toggle
  function toggleTheme() {
    const html = document.documentElement;
    const current = html.getAttribute('data-theme');
    const next = current === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', next);
    localStorage.setItem('tektik_theme', next);
  }
  const savedTheme = localStorage.getItem('tektik_theme');
  if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);

  // Auto-redirect if logged in
  if (Auth.isLoggedIn()) {
    window.location.href = '/dashboard';
  }

  const form = document.getElementById('signupForm');
  const alertEl = document.getElementById('alert');
  const submitBtn = document.getElementById('submitBtn');

  function showAlert(message, type = 'error') {
    alertEl.textContent = message;
    alertEl.className = `alert alert-${type}`;
    alertEl.style.display = 'block';
  }

  // Slug auto-lowercase
  document.getElementById('slug').addEventListener('input', (e) => {
    e.target.value = e.target.value.toLowerCase().replace(/[^a-z0-9-]/g, '');
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const slug = document.getElementById('slug').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    submitBtn.disabled = true;
    submitBtn.textContent = '⏳ OLUŞTURULUYOR...';
    alertEl.style.display = 'none';

    try {
      const data = await apiCall('/api/auth/signup', {
        method: 'POST',
        body: JSON.stringify({ slug, email, password })
      });

      Auth.setToken(data.token);
      Auth.setUser(data.user);

      showAlert('✅ Hesap oluşturuldu! Yönlendiriliyorsun...', 'success');

      setTimeout(() => {
        window.location.href = '/dashboard';
      }, 800);

    } catch (error) {
      showAlert(error.message);
      submitBtn.disabled = false;
      submitBtn.textContent = 'BAŞLA →';
    }
  });
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Şifremi Unuttum — tektik.la</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/auth.css">
</head>
<body>
<div class="grid-bg"></div>
<div class="content">
  <header>
    <a href="/" class="logo">tektik<span>.la</span></a>
    <div class="header-actions">
      <span class="path-indicator">/ FORGOT</span>
      <button class="ctrl-btn" onclick="toggleTheme()">◐</button>
    </div>
  </header>

  <main class="auth-main">
    <div class="auth-box">
      <span class="auth-label">— ŞİFRE SIFIRLAMA</span>
      <h1 class="auth-title">şifreni <span>unuttun?</span></h1>
      <p class="auth-subtitle">Email adresini gir, şifre sıfırlama linki gönderelim.</p>

      <div id="alert" class="alert"></div>

      <form id="forgotForm">
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input 
            type="email" 
            id="email" 
            class="form-input"
            placeholder="ornek@email.com"
            required
            autocomplete="email"
          >
        </div>

        <button type="submit" id="submitBtn" class="btn-primary">SIFIRLAMA LİNKİ GÖNDER →</button>
      </form>

      <div class="auth-footer">
        Hatırladın mı? <a href="/login">Giriş yap</a>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <p>© 2026 tektik.la</p>
    <p style="font-family:'Space Mono',monospace;font-size:11px;color:var(--text2);">v1.0</p>
  </footer>
</div>

<script>
  function toggleTheme() {
    const html = document.documentElement;
    const current = html.getAttribute('data-theme');
    const next = current === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', next);
    localStorage.setItem('tektik_theme', next);
  }
  const savedTheme = localStorage.getItem('tektik_theme');
  if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);

  const form = document.getElementById('forgotForm');
  const alertEl = document.getElementById('alert');
  const submitBtn = document.getElementById('submitBtn');

  function showAlert(message, type = 'success') {
    alertEl.textContent = message;
    alertEl.className = `alert alert-${type}`;
    alertEl.style.display = 'block';
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const email = document.getElementById('email').value.trim();
    submitBtn.disabled = true;
    submitBtn.textContent = '⏳ İŞLENİYOR...';
    
    // ŞIMDILIK: Backend hazır olunca bağlanacak
    // Şu an sadece "isteğin alındı" mesajı gösteriyoruz
    setTimeout(() => {
      showAlert(
        '✅ İsteğin alındı. Şu an mail sistemimiz hazırlık aşamasında. Şifre sıfırlama için iletişime geç: destek@tektik.la',
        'success'
      );
      submitBtn.style.display = 'none';
      form.querySelector('.form-group').style.display = 'none';
    }, 600);
  });
</script>

</body>
</html>
